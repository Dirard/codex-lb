name: Release

# Pushing a go-vX.Y.Z tag builds, verifies and publishes the Linux archives.
# Publishing never updates a running installation; operators apply updates.
on:
  push:
    tags: ["go-v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CODEX_LB_REQUIRE_EMBEDDED_UI: "1"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm --prefix web run install:deps
      - run: npm --prefix web run test
      - run: npm --prefix web run build
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race -timeout 30m ./...
      - name: Build archives
        env:
          SKIP_WEB_BUILD: "1"
        run: scripts/release.sh "${GITHUB_REF_NAME}" "dist/${GITHUB_REF_NAME}"
      # Signs SHA256SUMS with the offline-generated ed25519 key. Without the
      # secret this succeeds only while no trusted key is embedded in the build
      # (transition releases); afterwards an unsigned release fails here.
      - name: Sign checksums
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: go run ./cmd/release-sign sign "dist/${GITHUB_REF_NAME}/SHA256SUMS"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="openspec/specs/go-runtime/releases/${GITHUB_REF_NAME}.md"
          if [[ ! -s "$notes" ]]; then
            echo "missing release notes $notes" >&2
            exit 1
          fi
          title="$(head -n 1 "$notes" | sed 's/^# *//')"
          assets=("dist/${GITHUB_REF_NAME}"/codex-lb-*.tar.gz "dist/${GITHUB_REF_NAME}/SHA256SUMS")
          if [[ -f "dist/${GITHUB_REF_NAME}/SHA256SUMS.sig" ]]; then
            assets+=("dist/${GITHUB_REF_NAME}/SHA256SUMS.sig")
          fi
          gh release create "${GITHUB_REF_NAME}" --verify-tag --title "$title" --notes-file "$notes" "${assets[@]}"
