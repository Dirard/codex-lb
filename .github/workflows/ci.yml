name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.5.0
  GOVULNCHECK_VERSION: v1.6.0
  OPENSPEC_TELEMETRY: "0"
  CODEX_LB_REQUIRE_EMBEDDED_UI: "1"

jobs:
  go:
    name: Go (vet, lint, test, vuln)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The runtime tests check the embedded dashboard, as shipped in releases.
      - name: Build dashboard assets
        run: |
          npm --prefix web run install:deps
          npm --prefix web run build
      - run: go vet ./...
      - name: golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@"${GOLANGCI_LINT_VERSION}" run ./...
      - run: go test ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@"${GOVULNCHECK_VERSION}" ./...

  # The race detector slows the transpiled SQLite engine about 40-fold, so
  # one runner needed about 20 minutes; four shards split the tests between
  # them (scripts/race-shard.sh runs each test in exactly one shard).
  race:
    name: Go race (shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build dashboard assets
        run: |
          npm --prefix web run install:deps
          npm --prefix web run build
      - run: scripts/race-shard.sh ${{ matrix.shard }} 4

  web:
    name: Dashboard (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm --prefix web run install:deps
      - run: npm --prefix web run lint
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run test
      - run: npm --prefix web run build

  spec:
    name: OpenSpec validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npx --yes @fission-ai/openspec@1.12.0 validate --specs --no-interactive
